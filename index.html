
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>PMC Portal - Enterprise Workflow</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/images/pmc-favicon.png?v=20260526-v3" sizes="512x512">
    <link rel="apple-touch-icon" href="/images/pmc-favicon-180.png?v=20260526-v3" sizes="180x180">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dashboard-bg-url: url('/images/construction-bg.jpg');
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent;
            color: #8aa0b2;
        }
        html {
            background-color: #0b1d36;
        }
        .theme-dark-bg {
            background:
              radial-gradient(1200px 600px at 70% 0%, rgba(255, 255, 255, 0.08) 0%, #FFFFFF0F 60%),
              linear-gradient(180deg, rgba(10,26,48,1) 0%, rgba(9,23,42,1) 35%, rgba(6,17,32,1) 100%);
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }
        .glass-card-light {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.15);
            box-shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.08);
        }
        .kpi-card {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.12);
            transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
        }
        .kpi-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px rgba(0,0,0,0.5);
            border-color: rgba(255,255,255,0.15);
        }
        .kpi-accent-orange {
            background: linear-gradient(135deg, #ff8a00 0%, #ff6a00 100%);
        }
        .muted {
            color: #64748b;
        }
        .text-contrast {
            color: #cbd5e1;
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05);
        }
        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        /* Command-center sidebar — Shrikhande brand (blue + mint/cyan) */
        .nav-dark {
            background:
              linear-gradient(180deg, rgba(8, 22, 42, 0.99) 0%, rgba(6, 17, 32, 0.99) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid rgba(56, 189, 248, 0.12);
            box-shadow: inset -1px 0 0 rgba(72, 199, 142, 0.06);
        }
        .nav-light {
            background:
              linear-gradient(180deg, #ffffff 0%, #f7fbff 55%, #f3faf7 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid rgba(15, 23, 42, 0.08);
            box-shadow: 4px 0 24px rgba(15, 23, 42, 0.04);
        }
        .active-pill {
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.22) 0%, rgba(56, 189, 248, 0.12) 100%);
            color: #e0f7ff;
            box-shadow: 0 0 24px rgba(34, 211, 238, 0.18);
        }
        .active-pill-light {
            background: linear-gradient(135deg, #ecfeff 0%, #e0f2fe 55%, #d1fae5 100%) !important;
            color: #0e7490 !important;
            border: 1px solid #a5f3fc !important;
        }
        /* Sidebar active — cyan accent bar + soft glow (both themes) */
        button.sidebar-nav-item.sidebar-nav-active-light,
        button.sidebar-nav-item.active-pill-light {
            background: linear-gradient(90deg, rgba(6, 182, 212, 0.14) 0%, rgba(72, 199, 142, 0.08) 100%) !important;
            color: #0e7490 !important;
            border: 1px solid rgba(6, 182, 212, 0.28) !important;
            border-left: 3px solid #06b6d4 !important;
            box-shadow: 0 0 0 1px rgba(6, 182, 212, 0.06), 0 4px 16px rgba(6, 182, 212, 0.12);
        }
        button.sidebar-nav-item.sidebar-nav-active-dark,
        button.sidebar-nav-item.active-pill {
            background: linear-gradient(90deg, rgba(34, 211, 238, 0.18) 0%, rgba(56, 189, 248, 0.08) 70%, transparent 100%) !important;
            color: #e0f7ff !important;
            border: 1px solid rgba(34, 211, 238, 0.22) !important;
            border-left: 3px solid #22d3ee !important;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.16), inset 0 0 20px rgba(34, 211, 238, 0.04);
        }
        button.sidebar-nav-item.sidebar-nav-active-light:hover,
        button.sidebar-nav-item.sidebar-nav-active-dark:hover,
        button.sidebar-nav-item.active-pill-light:hover,
        button.sidebar-nav-item.active-pill:hover {
            transform: translateX(2px);
        }
        /* Sidebar — hover & micro-animations */
        @keyframes sidebarNavIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes sidebarActiveGlow {
            0%, 100% { box-shadow: 0 0 16px rgba(34, 211, 238, 0.12); }
            50% { box-shadow: 0 0 28px rgba(34, 211, 238, 0.22); }
        }
        @keyframes sidebarActiveGlowLight {
            0%, 100% { box-shadow: 0 2px 10px rgba(6, 182, 212, 0.1); }
            50% { box-shadow: 0 4px 16px rgba(6, 182, 212, 0.2); }
        }
        .app-sidebar {
            transition:
                width 0.36s cubic-bezier(0.16, 1, 0.3, 1),
                max-width 0.36s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.32s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.32s ease;
            overflow: hidden;
        }
        .sidebar-chrome {
            transition: opacity 0.22s ease, max-width 0.32s ease, transform 0.28s ease, margin 0.28s ease;
            white-space: nowrap;
        }
        .sidebar-logo-mark {
            display: none;
        }
        @media (min-width: 768px) {
            .app-sidebar.is-rail-collapsed {
                width: 4.5rem !important;
                max-width: 4.5rem !important;
            }
            .app-sidebar.is-rail-collapsed .sidebar-chrome {
                opacity: 0;
                max-width: 0;
                margin: 0;
                transform: translateX(-6px);
                pointer-events: none;
                overflow: hidden;
            }
            .app-sidebar.is-rail-collapsed .sidebar-header {
                padding-left: 0.55rem;
                padding-right: 0.55rem;
                align-items: center;
            }
            .app-sidebar.is-rail-collapsed .sidebar-logo-full {
                display: none;
            }
            .app-sidebar.is-rail-collapsed .sidebar-logo-mark {
                display: flex;
            }
            .app-sidebar.is-rail-collapsed .sidebar-role-badge {
                display: none;
            }
            .app-sidebar.is-rail-collapsed .sidebar-section-block {
                display: none;
            }
            .app-sidebar.is-rail-collapsed .sidebar-nav-item {
                justify-content: center;
                padding-left: 0.5rem;
                padding-right: 0.5rem;
                gap: 0;
                border-left-width: 0;
                border-radius: 0.85rem;
            }
            .app-sidebar.is-rail-collapsed button.sidebar-nav-item.sidebar-nav-active-light,
            .app-sidebar.is-rail-collapsed button.sidebar-nav-item.sidebar-nav-active-dark,
            .app-sidebar.is-rail-collapsed button.sidebar-nav-item.active-pill-light,
            .app-sidebar.is-rail-collapsed button.sidebar-nav-item.active-pill {
                border-left-width: 0 !important;
                box-shadow: 0 0 0 1px rgba(6, 182, 212, 0.35), 0 0 16px rgba(34, 211, 238, 0.2);
            }
            .app-sidebar.is-rail-collapsed .sidebar-nav-item-idle-light:hover,
            .app-sidebar.is-rail-collapsed .sidebar-nav-item-idle-dark:hover {
                transform: scale(1.06);
                border-left-color: transparent;
            }
            .app-sidebar.is-rail-collapsed .sidebar-profile-card {
                justify-content: center;
                align-items: center;
                gap: 0;
                width: 2.5rem;
                height: 2.5rem;
                margin: 0 auto;
                padding: 0 !important;
                border-radius: 9999px;
                background: transparent !important;
                border: none !important;
                box-shadow: none !important;
                overflow: visible;
            }
            .app-sidebar.is-rail-collapsed .sidebar-profile-card:hover {
                transform: scale(1.06);
                box-shadow: none !important;
            }
            .app-sidebar.is-rail-collapsed .sidebar-profile-card .sidebar-chrome {
                display: none !important;
            }
            .app-sidebar.is-rail-collapsed .sidebar-profile-card > img,
            .app-sidebar.is-rail-collapsed .sidebar-profile-card > div:first-child {
                width: 2.25rem !important;
                height: 2.25rem !important;
                border-radius: 9999px !important;
            }
            .app-sidebar.is-rail-collapsed .sidebar-footer {
                padding: 0.65rem 0.35rem 0.85rem;
                overflow: visible;
            }
            .app-sidebar.is-rail-collapsed .sidebar-footer-inner {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.4rem;
                padding: 0 !important;
            }
            .app-sidebar.is-rail-collapsed .sidebar-logout-row {
                justify-content: center;
                align-items: center;
                width: 2.5rem;
                height: 2.5rem;
                min-height: 2.5rem;
                margin: 0 auto;
                padding: 0 !important;
                gap: 0;
                border-radius: 9999px;
                border-left-width: 0 !important;
            }
            .app-sidebar.is-rail-collapsed .sidebar-logout-row:hover {
                transform: scale(1.06);
            }
            .app-sidebar.is-rail-collapsed .sidebar-logout-row .sidebar-chrome {
                display: none !important;
            }
            .app-sidebar.is-rail-collapsed .sidebar-alert-badge {
                position: absolute;
                top: 0.2rem;
                right: 0.2rem;
                height: 0.95rem;
                min-width: 0.95rem;
                padding: 0 0.2rem;
                font-size: 8px;
            }
        }
        .sidebar-backdrop {
            animation: fadeIn 0.28s ease-out forwards;
        }
        .sidebar-nav-item {
            position: relative;
            min-height: 2.5rem;
            border: 1px solid transparent;
            border-left: 3px solid transparent;
            transition:
                background-color 0.22s cubic-bezier(0.4, 0, 0.2, 1),
                color 0.22s ease,
                transform 0.22s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.22s ease,
                border-color 0.22s ease;
        }
        .sidebar-nav-enter:not(.sidebar-nav-active-light):not(.sidebar-nav-active-dark) {
            opacity: 0;
            animation: sidebarNavIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .sidebar-nav-icon {
            display: inline-flex;
            transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.22s ease;
        }
        .sidebar-nav-item-idle-light {
            color: #475569;
        }
        .sidebar-nav-item-idle-light:hover {
            background-color: rgba(6, 182, 212, 0.06) !important;
            color: #0f172a !important;
            border-left-color: rgba(6, 182, 212, 0.45);
            transform: translateX(2px);
        }
        .sidebar-nav-item-idle-light:hover .sidebar-nav-icon {
            transform: scale(1.08);
            color: #0891b2;
        }
        .sidebar-nav-item-idle-dark {
            color: rgba(226, 232, 240, 0.78);
        }
        .sidebar-nav-item-idle-dark:hover {
            background-color: rgba(34, 211, 238, 0.08) !important;
            color: #f8fafc !important;
            border-left-color: rgba(34, 211, 238, 0.5);
            transform: translateX(2px);
        }
        .sidebar-nav-item-idle-dark:hover .sidebar-nav-icon {
            transform: scale(1.08);
            color: #22d3ee;
            filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.45));
        }
        button.sidebar-nav-item.sidebar-nav-active-dark {
            animation: sidebarActiveGlow 3.2s ease-in-out infinite;
        }
        button.sidebar-nav-item.sidebar-nav-active-light {
            animation: sidebarActiveGlowLight 3.2s ease-in-out infinite;
        }
        button.sidebar-nav-item.sidebar-nav-active-dark .sidebar-nav-icon {
            color: #22d3ee;
            filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.55));
        }
        button.sidebar-nav-item.sidebar-nav-active-light .sidebar-nav-icon {
            color: #0891b2;
        }
        .sidebar-nav-item:active:not(.sidebar-nav-active-light):not(.sidebar-nav-active-dark):not(.active-pill):not(.active-pill-light) {
            transform: translateX(1px) scale(0.99);
        }
        .sidebar-section-label {
            letter-spacing: 0.16em;
        }
        .sidebar-role-badge-dark {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(34, 211, 238, 0.22);
            color: rgba(224, 247, 255, 0.9);
        }
        .sidebar-role-badge-light {
            background: linear-gradient(90deg, rgba(6, 182, 212, 0.08), rgba(72, 199, 142, 0.08));
            border: 1px solid rgba(6, 182, 212, 0.25);
            color: #0e7490;
        }
        .sidebar-alert-badge {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1c1917;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.55);
        }
        .sidebar-profile-card {
            transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
        }
        .sidebar-profile-card-light {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(15, 23, 42, 0.08);
        }
        .sidebar-profile-card-light:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
            border-color: rgba(6, 182, 212, 0.28);
        }
        .sidebar-profile-card-dark {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(34, 211, 238, 0.14);
        }
        .sidebar-profile-card-dark:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            border-color: rgba(34, 211, 238, 0.3);
        }
        .sidebar-logout-row-dark {
            color: rgba(226, 232, 240, 0.7);
        }
        .sidebar-logout-row-dark:hover {
            background: rgba(244, 63, 94, 0.12) !important;
            color: #fda4af !important;
        }
        .sidebar-logout-row-light {
            color: #64748b;
        }
        .sidebar-logout-row-light:hover {
            background: rgba(244, 63, 94, 0.08) !important;
            color: #e11d48 !important;
        }
        .sidebar-icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 9999px;
            transition: background-color 0.2s ease, transform 0.2s ease, color 0.2s ease;
        }
        .sidebar-icon-btn:hover {
            transform: scale(1.06);
        }
        .sidebar-icon-btn:active {
            transform: scale(0.96);
        }
        .sidebar-icon-btn-light:hover {
            background-color: #f0f9ff;
        }
        .sidebar-icon-btn-dark:hover {
            background-color: rgba(34, 211, 238, 0.1);
        }
        .sidebar-logo-wrap img {
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease, filter 0.25s ease;
            max-width: 100%;
            height: auto;
        }
        .sidebar-logo-wrap:hover img {
            transform: scale(1.02);
        }
        .nav-dark .sidebar-logo-wrap img {
            filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.15));
        }
        .status-badge {
            color: #8fe3b1;
        }
        .status-badge-white {
            color: #ffffff;
            opacity: 0.9;
        }
        .hero-bg{
            position:absolute;
            inset:0;
            background:
              linear-gradient(180deg, rgba(11,29,54,0.10) 0%, rgba(11,29,54,0.65) 55%, rgba(11,29,54,0.95) 100%),
              var(--dashboard-bg-url);
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            opacity: 0.95;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.06);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.18);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.28);
        }

        /* Global Animations */
        /* AI decision support CTA pulse */
        @keyframes pmc-ai-btn-pulse {
            0%, 100% {
                transform: translateY(0) scale(1);
                box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
            }
            50% {
                transform: translateY(-1px) scale(1.02);
                box-shadow: 0 8px 22px rgba(79, 70, 229, 0.5);
            }
        }

        @keyframes pmc-ai-btn-pulse-violet {
            0%, 100% {
                transform: translateY(0) scale(1);
                box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
            }
            50% {
                transform: translateY(-1px) scale(1.02);
                box-shadow: 0 8px 22px rgba(124, 58, 237, 0.5);
            }
        }

        @keyframes pmc-ai-shimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .pmc-ai-btn-summary {
            animation: pmc-ai-btn-pulse 2.2s ease-in-out infinite;
            background-size: 200% 200%;
        }

        .pmc-ai-btn-suggest {
            animation: pmc-ai-btn-pulse-violet 2.2s ease-in-out infinite;
            animation-delay: 0.35s;
        }

        .pmc-ai-btn-summary:hover,
        .pmc-ai-btn-suggest:hover {
            animation: none;
            transform: translateY(-2px) scale(1.03);
        }

        @media (prefers-reduced-motion: reduce) {
            .pmc-ai-btn-summary,
            .pmc-ai-btn-suggest {
                animation: none;
            }
        }

        /* Tab alert badges — quiet, no pulse */
        .pmc-tab-alert-badge {
            animation: none;
        }

        /* Soft navy highlight when jumping to a section */
        @keyframes pmc-look-here-flash {
            0% {
                box-shadow: 0 0 0 1px rgba(30, 58, 95, 0.28);
                outline: 1px solid rgba(30, 58, 95, 0.35);
                outline-offset: 2px;
                background-color: rgba(30, 58, 95, 0.04);
            }
            100% {
                box-shadow: 0 0 0 0 transparent;
                outline-color: transparent;
                background-color: transparent;
            }
        }

        .pmc-look-here-flash {
            border-radius: 0.75rem;
            animation: pmc-look-here-flash 1.8s ease-out 1;
            scroll-margin-top: 5.5rem;
            position: relative;
            z-index: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            .pmc-look-here-flash {
                animation: none;
                outline: 1px solid rgba(30, 58, 95, 0.4);
                outline-offset: 2px;
            }
        }

        /* Delay alert — infinite blink to draw attention when schedule is late */
        @keyframes pmc-delay-alert-blink {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.55);
            }
            50% {
                opacity: 0.55;
                transform: scale(1.03);
                box-shadow: 0 0 0 8px rgba(225, 29, 72, 0);
            }
        }

        @keyframes pmc-delay-alert-blink-dark {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(251, 113, 133, 0.5);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.03);
                box-shadow: 0 0 0 8px rgba(251, 113, 133, 0);
            }
        }

        .pmc-delay-alert-blink {
            animation: pmc-delay-alert-blink 1.15s ease-in-out infinite;
            will-change: opacity, transform, box-shadow;
        }

        .pmc-delay-alert-blink-dark {
            animation: pmc-delay-alert-blink-dark 1.15s ease-in-out infinite;
            will-change: opacity, transform, box-shadow;
        }

        @media (prefers-reduced-motion: reduce) {
            .pmc-delay-alert-blink,
            .pmc-delay-alert-blink-dark {
                animation: none;
                opacity: 1;
                transform: none;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.94) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        .animate-slide-up {
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-slide-in-right {
            animation: slideInRight 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-slide-in-left {
            animation: slideInLeft 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-entrance {
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }

        /* DPR / WPR Review — readable text on light/dark app theme (React isDarkTheme, not Tailwind dark:) */
        .dpr-review-dashboard--light,
        .wpr-review-dashboard--light {
            color: #0f172a;
        }
        .dpr-review-dashboard--dark,
        .wpr-review-dashboard--dark {
            color: #f1f5f9;
        }
