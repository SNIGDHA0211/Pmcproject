
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>PMC Portal - Enterprise Workflow</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/images/pmc-favicon.png?v=20260526-v3" sizes="512x512">
    <link rel="apple-touch-icon" href="/images/pmc-favicon-180.png?v=20260526-v3" sizes="180x180">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Source Sans 3"', 'system-ui', 'sans-serif'],
              display: ['Archivo', '"Source Sans 3"', 'system-ui', 'sans-serif'],
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --pmc-font-display: "Archivo", "Source Sans 3", system-ui, sans-serif;
            --pmc-font-body: "Source Sans 3", system-ui, sans-serif;
            --pmc-font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            /* Theme backgrounds: light = sunset cranes, dark = night site */
            --dashboard-bg-url-dark: url('/images/construction-bg.jpg');
            --dashboard-bg-url-light: url('/images/construction-cranes-bg.jpg');
            --dashboard-bg-url: var(--dashboard-bg-url-dark);
            --pmc-navy-950: #0a1420;
            --pmc-navy-900: #121a24;
            --pmc-navy-800: #1a2332;
            --pmc-steel-600: #4a5563;
            --pmc-steel-400: #8b9aab;
            --pmc-amber-500: #e68a00;
            --pmc-amber-400: #f59e0b;
            --pmc-amber-300: #ffb366;
            --pmc-sky-50: #e8f4fb;
            --pmc-sky-100: #d7ebf8;
            --pmc-sunset-100: #fff4e0;
            --pmc-sunset-200: #ffe4bc;
            --pmc-crane-yellow: #f5c518;
            --pmc-mist-50: #eef2f6;
            --pmc-mist-100: #f3f5f7;
            --pmc-warm-wash: #ffe8cc;
        }
        html[data-theme='light'] {
            --dashboard-bg-url: var(--dashboard-bg-url-light);
            background-color: var(--pmc-sky-50);
        }
        html[data-theme='dark'] {
            --dashboard-bg-url: var(--dashboard-bg-url-dark);
            background-color: var(--pmc-navy-950);
        }
        body {
            font-family: var(--pmc-font-body);
            background-color: transparent;
            color: #8aa0b2;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        html {
            background-color: var(--pmc-navy-950);
        }
        .theme-dark-bg {
            background:
              radial-gradient(1000px 520px at 72% 8%, rgba(230, 138, 0, 0.14) 0%, transparent 55%),
              linear-gradient(180deg, #0a1420 0%, #121a24 42%, #0a1420 100%);
        }
        .glass-card {
            background: rgba(18, 26, 36, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 179, 102, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
        }
        .glass-card-light {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(26, 35, 50, 0.12);
            box-shadow: 0 4px 20px 0 rgba(26, 35, 50, 0.08);
        }
        .kpi-card {
            background: rgba(18, 26, 36, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.12);
            transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
        }
        .kpi-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px rgba(0,0,0,0.5);
            border-color: rgba(245, 158, 11, 0.35);
        }
        .kpi-accent-orange {
            background: linear-gradient(135deg, #ffb366 0%, #e68a00 100%);
        }
        .muted {
            color: #8b9aab;
        }
        .text-contrast {
            color: #e8edf2;
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(245, 158, 11, 0.55);
            box-shadow: 0 0 0 4px rgba(230, 138, 0, 0.12);
        }
        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        /* Command-center sidebar — frosted glass, matches 360 overview */
        .nav-dark {
            background:
              linear-gradient(175deg, rgba(15, 39, 68, 0.92) 0%, rgba(11, 29, 54, 0.88) 48%, rgba(7, 20, 40, 0.9) 100%);
            backdrop-filter: blur(22px) saturate(1.3);
            -webkit-backdrop-filter: blur(22px) saturate(1.3);
            border-right: 1px solid rgba(103, 232, 249, 0.2);
            box-shadow:
              10px 0 36px rgba(0, 0, 0, 0.28),
              inset -1px 0 0 rgba(103, 232, 249, 0.08),
              inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }
        .nav-light {
            background:
              linear-gradient(175deg, rgba(255, 255, 255, 0.92) 0%, rgba(248, 250, 252, 0.88) 45%, rgba(236, 254, 255, 0.82) 100%);
            backdrop-filter: blur(22px) saturate(1.25);
            -webkit-backdrop-filter: blur(22px) saturate(1.25);
            border-right: 1px solid rgba(100, 116, 139, 0.28);
            box-shadow:
              10px 0 32px rgba(15, 23, 42, 0.08),
              inset -1px 0 0 rgba(6, 182, 212, 0.08),
              inset 0 1px 0 rgba(255, 255, 255, 0.85);
        }
        .active-pill {
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.24) 0%, rgba(56, 189, 248, 0.12) 100%);
            color: #e0f7ff;
            box-shadow: 0 0 22px rgba(34, 211, 238, 0.16);
        }
        .active-pill-light {
            background: linear-gradient(135deg, rgba(236, 254, 255, 0.95) 0%, rgba(224, 242, 254, 0.9) 55%, rgba(209, 250, 229, 0.75) 100%) !important;
            color: #0e7490 !important;
            border: 1px solid rgba(103, 232, 249, 0.55) !important;
        }
        /* Sidebar active — clear “you are here” without noisy glow */
        button.sidebar-nav-item.sidebar-nav-active-light,
        button.sidebar-nav-item.active-pill-light {
            background: linear-gradient(90deg, rgba(6, 182, 212, 0.18) 0%, rgba(255, 255, 255, 0.55) 100%) !important;
            color: #0e7490 !important;
            border: 1px solid rgba(6, 182, 212, 0.32) !important;
            border-left: 3px solid #06b6d4 !important;
            box-shadow:
              0 6px 16px rgba(6, 182, 212, 0.12),
              inset 0 1px 0 rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        button.sidebar-nav-item.sidebar-nav-active-dark,
        button.sidebar-nav-item.active-pill {
            background: linear-gradient(90deg, rgba(34, 211, 238, 0.22) 0%, rgba(15, 39, 68, 0.45) 70%, transparent 100%) !important;
            color: #e0f7ff !important;
            border: 1px solid rgba(34, 211, 238, 0.28) !important;
            border-left: 3px solid #22d3ee !important;
            box-shadow:
              0 0 18px rgba(34, 211, 238, 0.14),
              inset 0 1px 0 rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        button.sidebar-nav-item.sidebar-nav-active-light:hover,
        button.sidebar-nav-item.sidebar-nav-active-dark:hover,
        button.sidebar-nav-item.active-pill-light:hover,
        button.sidebar-nav-item.active-pill:hover {
            transform: translateX(2px);
        }
        /* Sidebar — hover & micro-animations */
        @keyframes sidebarNavIn {
            from { opacity: 0; transform: translateX(-8px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes sidebarHereIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes sidebarActiveSoft {
            0%, 100% { box-shadow: 0 0 14px rgba(34, 211, 238, 0.1); }
            50% { box-shadow: 0 0 20px rgba(34, 211, 238, 0.18); }
        }
        @keyframes sidebarActiveSoftLight {
            0%, 100% { box-shadow: 0 3px 10px rgba(6, 182, 212, 0.1); }
            50% { box-shadow: 0 4px 14px rgba(6, 182, 212, 0.16); }
        }
        .app-sidebar {
            transition:
                width 0.38s cubic-bezier(0.16, 1, 0.3, 1),
                max-width 0.38s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.32s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.32s ease;
            overflow: hidden;
        }
        .sidebar-chrome {
            transition: opacity 0.22s ease, max-width 0.32s ease, transform 0.28s ease, margin 0.28s ease;
            white-space: nowrap;
        }
        .sidebar-logo-mark {
            display: none;
        }
        .sidebar-here-chip {
            animation: sidebarHereIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .sidebar-here-chip-light {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.78), rgba(236, 254, 255, 0.62));
            border: 1px solid rgba(6, 182, 212, 0.28);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .sidebar-here-chip-dark {
            background: linear-gradient(145deg, rgba(34, 211, 238, 0.12), rgba(15, 39, 68, 0.45));
            border: 1px solid rgba(34, 211, 238, 0.22);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .sidebar-nav-scroll {
            scrollbar-gutter: stable;
        }
        .sidebar-section-toggle:focus-visible {
            outline: 2px solid rgba(6, 182, 212, 0.45);
            outline-offset: 2px;
        }
        @media (min-width: 768px) {
            .app-sidebar.is-rail-collapsed {
                width: 4.5rem !important;
                max-width: 4.5rem !important;
            }
            .app-sidebar.is-rail-collapsed .sidebar-chrome {
                opacity: 0;
                max-width: 0;
                margin: 0;
                transform: translateX(-6px);
                pointer-events: none;
                overflow: hidden;
            }
            .app-sidebar.is-rail-collapsed .sidebar-header {
                padding-left: 0.55rem;
                padding-right: 0.55rem;
                align-items: center;
            }
            .app-sidebar.is-rail-collapsed .sidebar-logo-full {
                display: none;
            }
            .app-sidebar.is-rail-collapsed .sidebar-logo-mark {
                display: flex;
            }
            .app-sidebar.is-rail-collapsed .sidebar-role-badge,
            .app-sidebar.is-rail-collapsed .sidebar-here-chip {
                display: none;
            }
            .app-sidebar.is-rail-collapsed .sidebar-section-block {
                display: none;
            }
            .app-sidebar.is-rail-collapsed .sidebar-nav-item {
                justify-content: center;
                padding-left: 0.5rem;
                padding-right: 0.5rem;
                gap: 0;
                border-left-width: 0;
                border-radius: 0.85rem;
            }
            .app-sidebar.is-rail-collapsed button.sidebar-nav-item.sidebar-nav-active-light,
            .app-sidebar.is-rail-collapsed button.sidebar-nav-item.sidebar-nav-active-dark,
            .app-sidebar.is-rail-collapsed button.sidebar-nav-item.active-pill-light,
            .app-sidebar.is-rail-collapsed button.sidebar-nav-item.active-pill {
                border-left-width: 0 !important;
                box-shadow: 0 0 0 1px rgba(6, 182, 212, 0.35), 0 0 14px rgba(34, 211, 238, 0.18);
            }
            .app-sidebar.is-rail-collapsed .sidebar-nav-item-idle-light:hover,
            .app-sidebar.is-rail-collapsed .sidebar-nav-item-idle-dark:hover {
                transform: scale(1.06);
                border-left-color: transparent;
            }
            .app-sidebar.is-rail-collapsed .sidebar-profile-card {
                justify-content: center;
                align-items: center;
                gap: 0;
                width: 2.5rem;
                height: 2.5rem;
                margin: 0 auto;
                padding: 0 !important;
                border-radius: 9999px;
                background: transparent !important;
                border: none !important;
                box-shadow: none !important;
                overflow: visible;
            }
            .app-sidebar.is-rail-collapsed .sidebar-profile-card:hover {
                transform: scale(1.06);
                box-shadow: none !important;
            }
            .app-sidebar.is-rail-collapsed .sidebar-profile-card .sidebar-chrome {
                display: none !important;
            }
            .app-sidebar.is-rail-collapsed .sidebar-profile-card > img,
            .app-sidebar.is-rail-collapsed .sidebar-profile-card > div:first-child {
                width: 2.25rem !important;
                height: 2.25rem !important;
                border-radius: 9999px !important;
            }
            .app-sidebar.is-rail-collapsed .sidebar-footer {
                padding: 0.65rem 0.35rem 0.85rem;
                overflow: visible;
            }
            .app-sidebar.is-rail-collapsed .sidebar-footer-inner {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.4rem;
                padding: 0 !important;
            }
            .app-sidebar.is-rail-collapsed .sidebar-logout-row {
                justify-content: center;
                align-items: center;
                width: 2.5rem;
                height: 2.5rem;
                min-height: 2.5rem;
                margin: 0 auto;
                padding: 0 !important;
                gap: 0;
                border-radius: 9999px;
                border-left-width: 0 !important;
            }
            .app-sidebar.is-rail-collapsed .sidebar-logout-row:hover {
                transform: scale(1.06);
            }
            .app-sidebar.is-rail-collapsed .sidebar-logout-row .sidebar-chrome {
                display: none !important;
            }
            .app-sidebar.is-rail-collapsed .sidebar-alert-badge {
                position: absolute;
                top: 0.2rem;
                right: 0.2rem;
                height: 0.95rem;
                min-width: 0.95rem;
                padding: 0 0.2rem;
                font-size: 8px;
            }
            .app-sidebar.is-rail-collapsed .sidebar-active-chevron {
                display: none !important;
            }
        }
        .sidebar-backdrop {
            animation: fadeIn 0.28s ease-out forwards;
        }
        .sidebar-nav-item {
            position: relative;
            min-height: 2.35rem;
            border: 1px solid transparent;
            border-left: 3px solid transparent;
            transition:
                background-color 0.22s cubic-bezier(0.4, 0, 0.2, 1),
                color 0.22s ease,
                transform 0.22s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.22s ease,
                border-color 0.22s ease,
                opacity 0.2s ease;
        }
        .sidebar-nav-enter:not(.sidebar-nav-active-light):not(.sidebar-nav-active-dark) {
            opacity: 0;
            animation: sidebarNavIn 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .sidebar-nav-icon {
            display: inline-flex;
            transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.22s ease;
        }
        .sidebar-nav-item-idle-light {
            color: #475569;
        }
        .sidebar-nav-item-idle-light:hover {
            background: linear-gradient(90deg, rgba(6, 182, 212, 0.1), rgba(255, 255, 255, 0.45)) !important;
            color: #0f172a !important;
            border-left-color: rgba(6, 182, 212, 0.5);
            border-color: rgba(6, 182, 212, 0.18);
            transform: translateX(2px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }
        .sidebar-nav-item-idle-light:hover .sidebar-nav-icon {
            transform: scale(1.08);
            color: #0891b2;
        }
        .sidebar-nav-item-idle-dark {
            color: rgba(226, 232, 240, 0.78);
        }
        .sidebar-nav-item-idle-dark:hover {
            background: linear-gradient(90deg, rgba(34, 211, 238, 0.12), rgba(15, 39, 68, 0.35)) !important;
            color: #f8fafc !important;
            border-left-color: rgba(34, 211, 238, 0.55);
            border-color: rgba(34, 211, 238, 0.16);
            transform: translateX(2px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .sidebar-nav-item-idle-dark:hover .sidebar-nav-icon {
            transform: scale(1.08);
            color: #22d3ee;
            filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.4));
        }
        button.sidebar-nav-item.sidebar-nav-active-dark {
            animation: sidebarActiveSoft 4s ease-in-out infinite;
        }
        button.sidebar-nav-item.sidebar-nav-active-light {
            animation: sidebarActiveSoftLight 4s ease-in-out infinite;
        }
        button.sidebar-nav-item.sidebar-nav-active-dark .sidebar-nav-icon {
            color: #22d3ee;
            filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.45));
        }
        button.sidebar-nav-item.sidebar-nav-active-light .sidebar-nav-icon {
            color: #0891b2;
        }
        .sidebar-nav-item:active:not(.sidebar-nav-active-light):not(.sidebar-nav-active-dark):not(.active-pill):not(.active-pill-light) {
            transform: translateX(1px) scale(0.99);
        }
        .sidebar-nav-item:focus-visible {
            outline: 2px solid rgba(6, 182, 212, 0.5);
            outline-offset: 2px;
        }
        .sidebar-section-label {
            letter-spacing: 0.12em;
        }
        .sidebar-role-badge-dark {
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.12), rgba(15, 39, 68, 0.5));
            border: 1px solid rgba(34, 211, 238, 0.26);
            color: rgba(224, 247, 255, 0.95);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .sidebar-role-badge-light {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.85), rgba(236, 254, 255, 0.7));
            border: 1px solid rgba(6, 182, 212, 0.28);
            color: #0e7490;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .sidebar-alert-badge {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1c1917;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.45);
            animation: sidebarHereIn 0.3s ease both;
        }
        .sidebar-profile-card {
            transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
        }
        .sidebar-profile-card-light {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.88), rgba(236, 254, 255, 0.7));
            border: 1px solid rgba(100, 116, 139, 0.28);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .sidebar-profile-card-light:hover {
            transform: translateY(-1px);
            box-shadow:
              0 8px 20px rgba(15, 23, 42, 0.08),
              inset 0 1px 0 rgba(255, 255, 255, 0.85);
            border-color: rgba(6, 182, 212, 0.35);
        }
        .sidebar-profile-card-dark {
            background: linear-gradient(145deg, rgba(15, 39, 68, 0.75), rgba(8, 47, 73, 0.55));
            border: 1px solid rgba(103, 232, 249, 0.2);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .sidebar-profile-card-dark:hover {
            transform: translateY(-1px);
            box-shadow:
              0 8px 24px rgba(0, 0, 0, 0.35),
              inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border-color: rgba(34, 211, 238, 0.35);
        }
        .sidebar-logout-row-dark {
            color: rgba(226, 232, 240, 0.7);
        }
        .sidebar-logout-row-dark:hover {
            background: rgba(244, 63, 94, 0.12) !important;
            color: #fda4af !important;
        }
        .sidebar-logout-row-light {
            color: #64748b;
        }
        .sidebar-logout-row-light:hover {
            background: rgba(244, 63, 94, 0.08) !important;
            color: #e11d48 !important;
        }
        .sidebar-icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 9999px;
            transition: background-color 0.2s ease, transform 0.2s ease, color 0.2s ease;
        }
        .sidebar-icon-btn:hover {
            transform: scale(1.06);
        }
        .sidebar-icon-btn:active {
            transform: scale(0.96);
        }
        .sidebar-icon-btn-light:hover {
            background-color: #f0f9ff;
        }
        .sidebar-icon-btn-dark:hover {
            background-color: rgba(34, 211, 238, 0.1);
        }
        .sidebar-logo-wrap img {
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease, filter 0.25s ease;
            max-width: 100%;
            height: auto;
        }
        .sidebar-logo-wrap:hover img {
            transform: scale(1.02);
        }
        .nav-dark .sidebar-logo-wrap img {
            filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.15));
        }
        @media (prefers-reduced-motion: reduce) {
            .sidebar-nav-enter,
            .sidebar-here-chip,
            .sidebar-alert-badge,
            button.sidebar-nav-item.sidebar-nav-active-dark,
            button.sidebar-nav-item.sidebar-nav-active-light {
                animation: none !important;
            }
            .app-sidebar,
            .sidebar-nav-item,
            .sidebar-nav-icon,
            .sidebar-chrome {
                transition: none !important;
            }
        }
        .status-badge {
            color: #8fe3b1;
        }
        .status-badge-white {
            color: #ffffff;
            opacity: 0.9;
        }
        .hero-bg{
            position:absolute;
            inset:0;
            background:
              linear-gradient(180deg, rgba(10,20,32,0.25) 0%, rgba(10,20,32,0.72) 55%, rgba(10,20,32,0.94) 100%),
              var(--dashboard-bg-url);
            background-size: cover;
            background-position: center 42%;
            background-repeat: no-repeat;
            opacity: 0.95;
        }
        /* Main workspace — construction atmosphere shows through */
        .app-main-scroll {
